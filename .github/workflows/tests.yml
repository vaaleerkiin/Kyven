name: Tests
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,dlss]"
      - run: python -m ruff check src hosts tests
      - run: python -m pytest -q -p no:cacheprovider
